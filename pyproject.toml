[project]
name = "ecognomy"
version = "0.1.0"
description = "A sandbox where an economy emerges from a population of learning agents"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
viz = [
    "dash>=2.17",
    "plotly>=5.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ecognomy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
